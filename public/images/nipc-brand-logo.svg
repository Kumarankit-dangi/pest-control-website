<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 125" fill="none">
  <!-- House Roof in Deep Blue -->
  <polygon points="45,45 85,12 125,45 115,45 85,20 55,45" fill="#0066cc"/>
  <rect x="100" y="20" width="12" height="18" fill="#0066cc"/>
  <polygon points="58,45 85,24 112,45" fill="#ffffff"/>
  <!-- Windows -->
  <rect x="76" y="28" width="7" height="7" fill="#0066cc"/>
  <rect x="86" y="28" width="7" height="7" fill="#0066cc"/>
  <rect x="76" y="37" width="7" height="7" fill="#0066cc"/>
  <rect x="86" y="37" width="7" height="7" fill="#0066cc"/>

  <!-- Left Shield Emblem with Exterminator Tech Silhouette -->
  <g transform="translate(4, 28)">
    <path d="M38 5 L68 16 C68 52 38 72 38 78 C38 72 8 52 8 16 Z" fill="#0055b3" stroke="#003366" stroke-width="2"/>
    <path d="M38 10 L62 20 C62 48 38 65 38 70 C38 65 14 48 14 20 Z" fill="#ffffff"/>
    <!-- Technician silhouette with sprayer -->
    <circle cx="34" cy="28" r="5" fill="#003366"/>
    <path d="M26 36 C26 33 42 33 42 36 L43 50 L38 50 L37 60 L31 60 L30 50 L25 50 Z" fill="#003366"/>
    <!-- Sprayer tank & wand -->
    <rect x="22" y="35" width="4" height="12" rx="1.5" fill="#0088cc"/>
    <line x1="26" y1="45" x2="48" y2="42" stroke="#003366" stroke-width="1.8"/>
    <!-- Green droplets -->
    <circle cx="50" cy="41" r="1.5" fill="#28a745"/>
    <circle cx="53" cy="40" r="1.5" fill="#28a745"/>
    <circle cx="52" cy="44" r="1.5" fill="#28a745"/>
  </g>

  <!-- Green leaf on shield corner -->
  <path d="M12 78 C12 60 30 50 48 54 C48 72 38 88 20 90 C16 90 13 84 12 78 Z" fill="#28a745"/>
  <path d="M12 78 Q 30 70 48 54" stroke="#ffffff" stroke-width="1.8" fill="none"/>

  <!-- NIPC Bold Gradient Text -->
  <defs>
    <linearGradient id="nipcBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>
  </defs>

  <text x="135" y="74" font-family="'Manrope', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="url(#nipcBlueGrad)" letter-spacing="-1">NIPC</text>

  <!-- Green Leaf inside/above 'P' and top right -->
  <g transform="translate(230, 26)">
    <path d="M2 24 C 10 12, 28 8, 42 14 C 38 26, 26 34, 12 31 C 6 29, 3 26, 2 24 Z" fill="#28a745"/>
    <path d="M2 24 Q 22 18 42 14" stroke="#ffffff" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Green Leaf on top right of NIPC -->
  <g transform="translate(270, 8)">
    <path d="M12 45 C 5 28, 20 8, 42 8 C 48 28, 38 48, 18 48 C 14 48, 12 46, 12 45 Z" fill="#28a745"/>
    <path d="M12 45 Q 26 28 42 8" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="32" cy="22" r="2.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Green Pill Bar with SERVICES Text -->
  <rect x="135" y="82" width="170" height="20" rx="10" fill="#28a745"/>
  <text x="220" y="96.5" font-family="'Manrope', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="4">SERVICES</text>

  <!-- Natural Insects Pest Control in green/black typography -->
  <text x="135" y="116" font-family="'Manrope', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#1b5e20" letter-spacing="0.4">(Natural Insects Pest Control)</text>
</svg>
